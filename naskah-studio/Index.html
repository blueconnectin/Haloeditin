<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--orange:#fe5826;--ink:#222;--cream:#f7eee5;--teal:#3fabae;--line:#eee7e1;--muted:#827c77;--bg:#fbf9f7;--green:#eaf5eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px}.brand{font-weight:800}.mark{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:8px;border-radius:12px;background:var(--orange);color:#fff}.nav{display:grid;gap:5px}.nav button{border:0;background:none;text-align:left;padding:11px;border-radius:9px;color:#716a64}.nav button.on{background:#fff0e9;color:var(--orange);font-weight:700}.profile{margin-top:auto;background:var(--cream);padding:12px;border-radius:10px}.top{background:#fff;border-bottom:1px solid var(--line);padding:20px 30px;display:flex;justify-content:space-between}.content{padding:30px;max-width:1450px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.head h1{font-size:25px;margin:0}.head p,.muted{color:var(--muted)}.btn{background:var(--orange);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.card small{color:var(--muted)}.card strong{display:block;font-size:23px;margin-top:8px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel h2{font-size:15px;margin:0 0 12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#a19a94;font-size:10px;text-transform:uppercase;padding:9px;border-bottom:1px solid var(--line)}td{padding:11px 9px;border-bottom:1px solid #f3efec;font-size:12px}.tag{display:inline-block;border-radius:99px;background:#fff0e9;color:#bd4923;padding:4px 8px;font-size:10px;font-weight:700}.green{background:var(--green);color:#46834e}.blue{background:#e6f6f4;color:#248383}.empty{text-align:center;padding:26px;color:#a29a93}.row{border:1px solid var(--line);border-radius:9px;padding:11px;margin:8px 0}.row small{display:block;color:var(--muted);margin-top:4px}.act{border:0;background:none;color:var(--orange);font-size:11px;font-weight:bold;padding:5px}.tools{display:flex;gap:8px;align-items:center}.search{padding:9px 11px;border:1px solid var(--line);border-radius:9px;min-width:190px}.modal-bg{position:fixed;inset:0;background:#2228;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal{background:#fff;border-radius:16px;padding:22px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:0 18px 60px #2223}.modal h2{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;margin:8px 0}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#655f5a}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:white;width:100%}.field textarea{min-height:76px;resize:vertical}.service-option{display:grid;grid-template-columns:auto 1fr auto 90px;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.file-link{color:#208d91}.subtle{font-size:12px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:65px 1fr}.side{padding:15px 7px}.brand span,.profile{display:none}.nav button{text-align:center;padding:12px 4px;font-size:10px}.grid{grid-template-columns:1fr}.content{padding:22px}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:580px){.layout{display:block}.side{position:fixed;bottom:0;left:0;right:0;height:57px;padding:4px;z-index:2;border:0;border-top:1px solid var(--line)}.brand{display:none}.nav{display:flex;justify-content:space-around}.nav button{padding:6px;font-size:9px}.top{padding:13px}.content{padding:18px 12px 75px}.head{align-items:flex-start;flex-direction:column}.metrics{gap:8px}.card{padding:12px}.card strong{font-size:19px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.search{min-width:0;width:100%}.service-option{grid-template-columns:auto 1fr 80px}.service-option .price{display:none}}
</style></head><body>
<div id="app" class="empty">Memuat haloeditin…</div><div id="modalBg" class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div id="modalContent"></div></div></div>
<script>
var D,P='Dashboard',M=['Dashboard','Pesanan','Tugas saya','Layanan','Pembayaran','Pengguna'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function rp(x){return 'Rp '+Number(x||0).toLocaleString('id-ID')}function dt(x){return x?new Date(x).toLocaleDateString('id-ID'):'—'}function tag(s){return '<span class="tag '+(['Lunas','Selesai','Siap Dikerjakan'].includes(s)?'green':['Dikerjakan','DP'].includes(s)?'blue':'')+'">'+esc(s)+'</span>'}function fail(e){alert(e&&e.message||e||'Terjadi kesalahan')}function call(name,args,done){var r=google.script.run.withFailureHandler(fail).withSuccessHandler(done||reload);r[name].apply(r,args||[])}function init(){google.script.run.withSuccessHandler(function(x){D=x;draw()}).withFailureHandler(function(e){document.getElementById('app').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}).getBootstrap()}
function go(n){P=n;draw()}function draw(){var role=D.user.Role,ns=M.filter(function(n){return !(role==='Editor'&&['Layanan','Pembayaran','Pengguna'].includes(n))&&!(role==='Admin'&&n==='Pengguna')});if(!ns.includes(P))P='Dashboard';var views={Dashboard:home,Pesanan:orders,'Tugas saya':tasks,Layanan:services,Pembayaran:payments,Pengguna:users};document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="brand"><b class="mark">H</b><span>haloeditin</span></div><nav class="nav">'+ns.map(function(n){return '<button class="'+(n===P?'on':'')+'" onclick="go(\''+n+'\')">'+n+'</button>'}).join('')+'</nav><div class="profile">'+esc(D.user.Nama)+'<br>'+esc(role)+'</div></aside><main><header class="top">Workspace / '+P+'<span>'+esc(D.user.Nama)+'</span></header><section class="content">'+views[P]()+'</section></main></div>'}
function metric(a,b){return '<div class="card"><small>'+a+'</small><strong>'+b+'</strong></div>'}function head(title,sub,button){return '<div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+button+'</div>'}function orderTable(os){return os.length?'<div class="scroll"><table><tr><th>Pesanan</th><th>Klien</th><th>Layanan</th><th>Editor</th><th>Tenggat</th><th>Status</th><th>Tagihan</th><th></th></tr>'+os.map(function(o){var paid=paidFor(o.OrderID);return '<tr><td><b>'+esc(o.Judul)+'</b><br><span class="subtle">'+esc(o.OrderID)+'</span></td><td>'+esc(o.NamaKlien)+'</td><td>'+esc((o.items||[]).map(function(i){return i.NamaLayanan}).join(', ')||'—')+'</td><td>'+esc(o.task?nameFor(o.task.EditorEmail):'Belum ditugaskan')+'</td><td>'+dt(o.Deadline)+'</td><td>'+tag(o.Status)+'</td><td>'+rp(paid)+' / '+rp(o.Total)+'</td><td><button class="act" onclick="openOrder(\''+esc(o.OrderID)+'\')">Detail</button></td></tr>'}).join('')+'</table></div>':'<div class="empty">Belum ada pesanan.</div>'}function paidFor(id){return (D.payments||[]).filter(function(p){return p.OrderID===id&&p.Status!=='Refund'}).reduce(function(s,p){return s+Number(p.Nominal||0)},0)}function nameFor(email){var u=(D.users||[]).find(function(x){return x.Email===email});return u?u.Nama:email||'—'}
function home(){var os=D.orders,paid=(D.payments||[]).filter(function(p){return p.Status!=='Refund'}).reduce(function(s,p){return s+Number(p.Nominal||0)},0),left=os.reduce(function(s,o){return s+Math.max(0,Number(o.Total)-paidFor(o.OrderID))},0),active=os.filter(function(o){return !['Selesai','Dibatalkan'].includes(o.Status)});return head('Selamat datang, '+esc(D.user.Nama.split(' ')[0])+' 👋','Ringkasan pekerjaan dan pembayaran.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newOrder()">＋ Pesanan baru</button>')+'<div class="metrics">'+metric('Pesanan aktif',active.length)+metric('Tenggat terlewat',active.filter(function(o){return o.Deadline&&new Date(o.Deadline)<new Date()}).length)+metric('Pembayaran masuk',rp(paid))+metric('Sisa tagihan',rp(left))+'</div><div class="grid"><div class="panel"><h2>Pesanan terbaru</h2>'+orderTable(os.slice().reverse().slice(0,6))+'</div><div class="panel"><h2>Fokus pengerjaan</h2>'+(D.tasks.length?D.tasks.map(function(t){return '<div class="row"><b>'+esc(orderName(t.OrderID))+'</b><small>'+dt(t.Deadline)+' · '+tag(t.Status)+'</small></div>'}).join(''):'<div class="empty">Belum ada tugas aktif.</div>')+'</div></div>'}function orderName(id){var o=D.orders.find(function(x){return x.OrderID===id});return o?o.Judul:id}
function orders(){return head('Pesanan','Kelola klien, layanan, editor, tenggat, dan file.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newOrder()">＋ Pesanan baru</button>')+'<div class="panel">'+orderTable(D.orders.slice().reverse())+'</div>'}
function tasks(){return head('Tugas saya','Perbarui progres pekerjaan yang ditugaskan.','')+'<div class="panel">'+(D.tasks.length?D.tasks.map(function(t){return '<div class="row"><b>'+esc(orderName(t.OrderID))+'</b><small>'+esc(t.OrderID)+' · Tenggat '+dt(t.Deadline)+' · '+tag(t.Status)+'</small><small>'+esc(t.Catatan||'Belum ada catatan')+'</small><button class="act" onclick="editTask(\''+esc(t.TaskID)+'\')">Perbarui progres</button><button class="act" onclick="openOrder(\''+esc(t.OrderID)+'\')">File pekerjaan</button></div>'}).join(''):'<div class="empty">Belum ada tugas untuk Anda.</div>')+'</div>'}
function services(){return head('Layanan','Daftar jasa dan tarif dasar.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newService()">＋ Tambah layanan</button>')+'<div class="panel">'+(D.services.length?'<div class="scroll"><table><tr><th>Layanan</th><th>Deskripsi</th><th>Harga dasar</th></tr>'+D.services.map(function(s){return '<tr><td><b>'+esc(s.Nama)+'</b></td><td>'+esc(s.Deskripsi)+'</td><td>'+rp(s.HargaDasar)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Katalog belum diisi. Tambahkan layanan atau impor dari daftar Excel nanti.</div>')+'</div>'}
function payments(){return head('Pembayaran','Riwayat transaksi dan sisa tagihan.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newPayment()">＋ Catat pembayaran</button>')+'<div class="panel">'+((D.payments||[]).length?'<div class="scroll"><table><tr><th>Tanggal</th><th>ID pembayaran</th><th>Pesanan</th><th>Nominal</th><th>Metode</th><th>Status</th></tr>'+D.payments.slice().reverse().map(function(p){return '<tr><td>'+dt(p.Tanggal)+'</td><td>'+esc(p.PaymentID)+'</td><td>'+esc(orderName(p.OrderID))+'<br><span class="subtle">'+esc(p.OrderID)+'</span></td><td>'+rp(p.Nominal)+'</td><td>'+esc(p.Metode)+'</td><td>'+tag(p.Status)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Belum ada pembayaran tercatat.</div>')+'</div>'}
function users(){return head('Pengguna','Kelola akses Owner, Admin, dan Editor.','<button class="btn" onclick="newUser()">＋ Tambah pengguna</button>')+'<div class="panel">'+D.users.map(function(u){return '<div class="row"><b>'+esc(u.Nama)+'</b><small>'+esc(u.Email)+' · '+tag(u.Role)+' · '+esc(u.Aktif)+'</small></div>'}).join('')+'</div>'}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalBg').style.display='flex'}function closeModal(){document.getElementById('modalBg').style.display='none'}function reload(){closeModal();google.script.run.withSuccessHandler(function(x){D=x;draw()}).withFailureHandler(fail).getBootstrap()}
function newOrder(){var editors=(D.users||[]).filter(function(u){return u.Role==='Editor'&&String(u.Aktif).toLowerCase()!=='tidak'});openModal('<h2>Pesanan baru</h2><form id="orderForm" onsubmit="submitOrder(event)"><div class="form-grid"><div class="field"><label>Nama klien *</label><input name="client" required></div><div class="field"><label>Kontak klien</label><input name="contact" placeholder="WhatsApp / telepon"></div><div class="field"><label>Email klien</label><input name="email" type="email"></div><div class="field"><label>Judul pekerjaan *</label><input name="title" required placeholder="Contoh: Skripsi Bab 1–5"></div><div class="field"><label>Jenis dokumen</label><select name="doctype"><option>Skripsi</option><option>Artikel</option><option>Jurnal</option><option>Lainnya</option></select></div><div class="field"><label>Tenggat</label><input name="deadline" type="date"></div><div class="field full"><label>Pilih layanan</label>'+(D.services.length?D.services.map(function(s){return '<label class="service-option"><input type="checkbox" data-svc="'+esc(s.ServiceID)+'"><span>'+esc(s.Nama)+'<small class="subtle">'+esc(s.Deskripsi||'')+'</small></span><span class="price">'+rp(s.HargaDasar)+'</span><input type="number" min="1" value="1" data-qty="'+esc(s.ServiceID)+'" aria-label="Jumlah '+esc(s.Nama)+'"></label>'}).join(''):'<p class="subtle">Belum ada layanan. Pesanan tetap bisa dibuat tanpa layanan.</p>')+'</div><div class="field"><label>Tugaskan ke editor</label><select name="editor"><option value="">Belum ditugaskan</option>'+editors.map(function(u){return '<option value="'+esc(u.Email)+'">'+esc(u.Nama)+' — '+esc(u.Email)+'</option>'}).join('')+'</select></div><div class="field full"><label>Catatan</label><textarea name="note" placeholder="Brief atau instruksi pekerjaan"></textarea></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan pesanan</button></div></form>')}
function submitOrder(e){e.preventDefault();var f=e.target,items=[];document.querySelectorAll('[data-svc]:checked').forEach(function(c){var s=D.services.find(function(x){return x.ServiceID===c.dataset.svc});items.push({ServiceID:s.ServiceID,NamaLayanan:s.Nama,Qty:Number(document.querySelector('[data-qty="'+s.ServiceID+'"]').value||1),Harga:Number(s.HargaDasar||0)})});var input={NamaKlien:f.client.value,Kontak:f.contact.value,Email:f.email.value,Judul:f.title.value,JenisDokumen:f.doctype.value,Deadline:f.deadline.value,Catatan:f.note.value,EditorEmail:f.editor.value,items:items};google.script.run.withSuccessHandler(function(x){closeModal();reload();alert('Pesanan '+x.id+' berhasil dibuat. Folder file tersedia di detail pesanan.')}).withFailureHandler(fail).saveOrder(input)}
function openOrder(id){var o=D.orders.find(function(x){return x.OrderID===id});if(!o)return;var pays=(D.payments||[]).filter(function(p){return p.OrderID===id}),files='Memuat file…';openModal('<h2>'+esc(o.Judul)+'</h2><p class="subtle">'+esc(o.OrderID)+' · '+tag(o.Status)+'</p><div class="form-grid"><div><b>Klien</b><br>'+esc(o.NamaKlien)+'<br>'+esc(o.JenisDokumen||'')+'</div><div><b>Tenggat</b><br>'+dt(o.Deadline)+'<br>Editor: '+esc(o.task?nameFor(o.task.EditorEmail):'Belum ditugaskan')+'</div><div class="field full"><b>Layanan</b><br>'+(o.items||[]).map(function(i){return esc(i.NamaLayanan)+' × '+i.Qty+' — '+rp(i.Subtotal)}).join('<br>')+'<br><b>Total '+rp(o.Total)+'</b></div><div class="field full"><b>Pembayaran</b><br>'+(pays.length?pays.map(function(p){return dt(p.Tanggal)+' · '+rp(p.Nominal)+' · '+tag(p.Status)}).join('<br>'):'Belum ada pembayaran')+'</div><div class="field full"><b>File pesanan</b><div id="fileList">'+files+'</div><label class="act" for="fileInput">＋ Unggah file</label><input id="fileInput" type="file" style="display:none" onchange="uploadSelected(\''+esc(id)+'\',this)"><p class="subtle">Maksimal 8 MB per file. File editor masuk ke File Kerja; file owner/admin masuk ke File Awal.</p></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Tutup</button>'+(D.user.Role==='Owner'||D.user.Role==='Admin'?'<button class="btn" onclick="newPayment(\''+esc(id)+'\')">＋ Pembayaran</button>':'')+'</div>');google.script.run.withSuccessHandler(function(fs){var el=document.getElementById('fileList');if(el)el.innerHTML=fs.length?fs.map(function(f){return '<div><a class="file-link" target="_blank" href="'+esc(f.url)+'">'+esc(f.name)+'</a></div>'}).join(''):'Belum ada file.'}).withFailureHandler(fail).getOrderFiles(id)}
function uploadSelected(id,input){var file=input.files[0];if(!file)return;if(file.size>8*1024*1024){alert('Ukuran file maksimal 8 MB.');input.value='';return}var reader=new FileReader();reader.onload=function(){var data=String(reader.result).split(',')[1];google.script.run.withSuccessHandler(function(){openOrder(id);google.script.run.withSuccessHandler(function(fs){var el=document.getElementById('fileList');if(el)el.innerHTML=fs.map(function(f){return '<div><a class="file-link" target="_blank" href="'+esc(f.url)+'">'+esc(f.name)+'</a></div>'}).join('')||'Belum ada file.'}).getOrderFiles(id)}).withFailureHandler(fail).uploadFile(id,file.name,file.type||'application/octet-stream',data)};reader.readAsDataURL(file)}
function newPayment(orderId){var choices=D.orders.filter(function(o){return !orderId||o.OrderID===orderId});if(!choices.length){alert('Belum ada pesanan.');return}openModal('<h2>Catat pembayaran</h2><form id="payForm" onsubmit="submitPayment(event)"><div class="field"><label>Pesanan *</label><select name="order" required>'+choices.map(function(o){return '<option value="'+esc(o.OrderID)+'">'+esc(o.Judul)+' · sisa '+rp(Math.max(0,Number(o.Total)-paidFor(o.OrderID)))+'</option>'}).join('')+'</select></div><div class="form-grid"><div class="field"><label>Nominal *</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Tanggal</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Metode</label><select name="method"><option>Transfer</option><option>Tunai</option><option>E-wallet</option><option>Lainnya</option></select></div><div class="field"><label>Status</label><select name="status"><option>DP</option><option>Lunas</option></select></div><div class="field full"><label>Catatan</label><input name="note"></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan pembayaran</button></div></form>')}
function submitPayment(e){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(reload).withFailureHandler(fail).addPayment({OrderID:f.order.value,Nominal:f.amount.value,Tanggal:f.date.value,Metode:f.method.value,Status:f.status.value,Catatan:f.note.value})}
function newService(){openModal('<h2>Tambah layanan</h2><form id="serviceForm" onsubmit="submitService(event)"><div class="field"><label>Nama layanan *</label><input name="name" required></div><div class="field"><label>Deskripsi</label><textarea name="desc"></textarea></div><div class="field"><label>Harga dasar (Rp) *</label><input name="price" type="number" min="0" required></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan layanan</button></div></form>')}
function submitService(e){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(reload).withFailureHandler(fail).saveService({Nama:f.name.value,Deskripsi:f.desc.value,HargaDasar:f.price.value})}
function newUser(){openModal('<h2>Tambah pengguna</h2><form id="userForm" onsubmit="submitUser(event)"><div class="field"><label>Nama *</label><input name="name" required></div><div class="field"><label>Email akun Google *</label><input name="email" type="email" required></div><div class="field"><label>Role</label><select name="role"><option>Editor</option><option>Admin</option><option>Owner</option></select></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan pengguna</button></div></form>')}
function submitUser(e){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(reload).withFailureHandler(fail).saveUser({Nama:f.name.value,Email:f.email.value,Role:f.role.value})}
function editTask(id){var t=D.tasks.find(function(x){return x.TaskID===id});openModal('<h2>Perbarui progres</h2><form id="taskForm" onsubmit="submitTask(event,\''+esc(id)+'\')"><div class="field"><label>Status tugas</label><select name="status">'+D.statuses.tasks.map(function(s){return '<option '+(s===t.Status?'selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select></div><div class="field"><label>Catatan progres</label><textarea name="note">'+esc(t.Catatan||'')+'</textarea></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan progres</button></div></form>')}
function submitTask(e,id){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(reload).withFailureHandler(fail).updateTask(id,f.status.value,f.note.value)}init();
</script></body></html>

<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--o:#fe5826;--i:#222;--c:#f7eee5;--t:#3fabae;--line:#eee7e1;--muted:#827c77;--bg:#fbf9f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px/1.5 Inter,system-ui,sans-serif}button{cursor:pointer;font:inherit}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:white;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px}.brand{font-weight:800}.mark{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:8px;border-radius:12px;background:var(--o);color:#fff}.nav{display:grid;gap:5px}.nav button{border:0;background:none;text-align:left;padding:11px;border-radius:9px;color:#716a64}.nav button.on{background:#fff0e9;color:var(--o);font-weight:700}.profile{margin-top:auto;background:var(--c);padding:12px;border-radius:10px}.top{background:#fff;border-bottom:1px solid var(--line);padding:20px 30px;display:flex;justify-content:space-between}.content{padding:30px;max-width:1350px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{font-size:25px;margin:0}.head p,.muted{color:var(--muted)}.btn{background:var(--o);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.card small{color:var(--muted)}.card strong{display:block;font-size:23px;margin-top:8px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel h2{font-size:15px;margin:0 0 12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#a19a94;font-size:10px;text-transform:uppercase;padding:9px;border-bottom:1px solid var(--line)}td{padding:11px 9px;border-bottom:1px solid #f3efec;font-size:12px}.tag{border-radius:99px;background:#fff0e9;color:#bd4923;padding:4px 8px;font-size:10px;font-weight:700}.green{background:#eaf5eb;color:#46834e}.blue{background:#e6f6f4;color:#248383}.empty{text-align:center;padding:26px;color:#a29a93}.row{border:1px solid var(--line);border-radius:9px;padding:11px;margin:8px 0}.row small{display:block;color:var(--muted);margin-top:4px}.act{border:0;background:none;color:var(--o);font-size:11px;font-weight:bold;padding:5px}@media(max-width:800px){.layout{grid-template-columns:65px 1fr}.side{padding:15px 7px}.brand span,.profile{display:none}.nav button{text-align:center;padding:12px 4px;font-size:10px}.grid{grid-template-columns:1fr}.content{padding:22px}}@media(max-width:580px){.layout{display:block}.side{position:fixed;bottom:0;left:0;right:0;height:57px;padding:4px;z-index:2;border:0;border-top:1px solid var(--line)}.brand{display:none}.nav{display:flex;justify-content:space-around}.nav button{padding:6px;font-size:9px}.top{padding:13px}.content{padding:18px 12px 75px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.card strong{font-size:19px}}
</style></head><body><div id="app" class="empty">Memuat…</div><script>
var D,P='Dashboard',M=['Dashboard','Pesanan','Tugas saya','Layanan','Pembayaran','Pengguna'];function safe(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function rp(x){return 'Rp '+Number(x||0).toLocaleString('id-ID')}function dt(x){return x?new Date(x).toLocaleDateString('id-ID'): '—'}function tag(s){return '<span class="tag '+(['Lunas','Selesai','Siap Dikerjakan'].includes(s)?'green':['Dikerjakan','DP'].includes(s)?'blue':'')+'">'+safe(s)+'</span>'}function init(){google.script.run.withSuccessHandler(function(x){D=x;draw()}).withFailureHandler(function(e){document.getElementById('app').innerHTML='<div class="empty">'+safe(e.message)+'<br>Jalankan setup() sebagai owner.</div>'}).getBootstrap()}function go(n){P=n;draw()}function draw(){var role=D.user.Role,ns=M.filter(function(n){return !(role==='Editor'&&['Layanan','Pembayaran','Pengguna'].includes(n))&&!(role==='Admin'&&n==='Pengguna')});if(!ns.includes(P))P='Dashboard';var body=({Dashboard:home,Pesanan:orders,'Tugas saya':tasks,Layanan:services,Pembayaran:payments,Pengguna:users}[P])();document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="brand"><b class="mark">H</b><span>haloeditin</span></div><nav class="nav">'+ns.map(function(n){return '<button class="'+(n===P?'on':'')+'" onclick="go(\''+n+'\')">'+n+'</button>'}).join('')+'</nav><div class="profile">'+safe(D.user.Nama)+'<br>'+safe(role)+'</div></aside><main><header class="top">Workspace / '+P+'<span>'+safe(D.user.Nama)+'</span></header><section class="content">'+body+'</section></main></div>'}function metric(a,b){return '<div class="card"><small>'+a+'</small><strong>'+b+'</strong></div>'}function table(os){return os.length?'<div class="scroll"><table><tr><th>Pesanan</th><th>Klien</th><th>Tenggat</th><th>Status</th><th>Nilai</th></tr>'+os.map(function(o){return '<tr><td><b>'+safe(o.Judul)+'</b><br>'+safe(o.OrderID)+'</td><td>'+safe(o.NamaKlien)+'</td><td>'+dt(o.Deadline)+'</td><td>'+tag(o.Status)+'</td><td>'+rp(o.Total)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Belum ada data.</div>'}function head(title,sub,button){return '<div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+button+'</div>'}function home(){var os=D.orders,paid=0,left=0;os.forEach(function(o){var p=o.payments.reduce(function(a,x){return a+Number(x.Nominal||0)},0);paid+=p;left+=Math.max(0,Number(o.Total)-p)});return head('Selamat datang, '+safe(D.user.Nama.split(' ')[0])+' 👋','Ringkasan jasa dokumen.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newOrder()">＋ Pesanan baru</button>')+'<div class="metrics">'+metric('Pesanan aktif',os.filter(function(o){return !['Selesai','Dibatalkan'].includes(o.Status)}).length)+metric('Tenggat terlewat',os.filter(function(o){return o.Deadline&&new Date(o.Deadline)<new Date()&&o.Status!=='Selesai'}).length)+metric('Pembayaran masuk',rp(paid))+metric('Sisa tagihan',rp(left))+'</div><div class="grid"><div class="panel"><h2>Pesanan terbaru</h2>'+table(os.slice().reverse().slice(0,6))+'</div><div class="panel"><h2>Fokus pengerjaan</h2>'+D.tasks.map(function(t){return '<div class="row"><b>'+safe(t.OrderID)+'</b><small>'+dt(t.Deadline)+' · '+tag(t.Status)+'</small></div>'}).join('')+'</div></div>'}function orders(){return head('Pesanan','Daftar pekerjaan dan tenggat klien.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newOrder()">＋ Pesanan baru</button>')+'<div class="panel">'+table(D.orders.slice().reverse())+'</div>'}function tasks(){return head('Tugas saya','Perbarui progres dan file pekerjaan.','')+'<div class="panel">'+D.tasks.map(function(t){return '<div class="row"><b>'+safe(t.OrderID)+'</b><small>'+dt(t.Deadline)+' · '+tag(t.Status)+'</small><button class="act" onclick="editTask(\''+t.TaskID+'\')">Perbarui progres</button><button class="act" onclick="files(\''+t.OrderID+'\')">File</button></div>'}).join('')+'</div>'}function services(){return head('Layanan','Katalog jasa dan harga dasar.','<button class="btn" onclick="newService()">＋ Tambah layanan</button>')+'<div class="panel">'+(D.services.length?'<table><tr><th>Layanan</th><th>Deskripsi</th><th>Harga</th></tr>'+D.services.map(function(s){return '<tr><td>'+safe(s.Nama)+'</td><td>'+safe(s.Deskripsi)+'</td><td>'+rp(s.HargaDasar)+'</td></tr>'}).join('')+'</table>':'<div class="empty">Katalog masih kosong.</div>')+'</div>'}function payments(){return head('Pembayaran','Transaksi dan status tagihan.','<button class="btn" onclick="newPayment()">＋ Catat pembayaran</button>')+'<div class="panel">'+table(D.orders)+'</div>'}function users(){return head('Pengguna','Akun dan role tim.','<button class="btn" onclick="newUser()">＋ Tambah pengguna</button>')+'<div class="panel">'+D.users.map(function(u){return '<div class="row"><b>'+safe(u.Nama)+'</b><small>'+safe(u.Email)+' · '+tag(u.Role)+'</small></div>'}).join('')+'</div>'}function reload(){google.script.run.withSuccessHandler(function(x){D=x;draw()}).getBootstrap()}function newOrder(){var n=prompt('Nama klien');if(!n)return;var title=prompt('Nama pekerjaan');if(!title)return;var svc=D.services[0];google.script.run.withSuccessHandler(function(){reload()}).saveOrder({NamaKlien:n,Judul:title,items:svc?[{ServiceID:svc.ServiceID,NamaLayanan:svc.Nama,Qty:1,Harga:svc.HargaDasar}]:[]})}function newService(){var n=prompt('Nama layanan');if(!n)return;var p=prompt('Harga dasar (angka)','0');google.script.run.withSuccessHandler(reload).saveService({Nama:n,HargaDasar:p})}function newPayment(){if(!D.orders.length)return alert('Belum ada pesanan');var o=D.orders[0],v=prompt('Nominal pembayaran untuk '+o.OrderID);if(!v)return;google.script.run.withSuccessHandler(reload).addPayment({OrderID:o.OrderID,Nominal:v,Status:'DP',Metode:'Transfer'})}function newUser(){var email=prompt('Email Google pengguna');if(!email)return;var role=prompt('Role: Admin, Editor, atau Owner','Editor');google.script.run.withSuccessHandler(reload).saveUser({Nama:email.split('@')[0],Email:email,Role:role})}function editTask(id){var t=D.tasks.find(function(x){return x.TaskID===id});var s=prompt('Status tugas',t.Status);if(!s)return;google.script.run.withSuccessHandler(reload).updateTask(id,s,prompt('Catatan',t.Catatan||''))}function files(id){google.script.run.withSuccessHandler(function(x){alert(x.map(function(f){return f.name+' — '+f.url}).join('\n')||'Belum ada file')}).getOrderFiles(id)}init();
</script></body></html>

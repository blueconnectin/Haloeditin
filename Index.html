var TOKEN=localStorage.getItem("haloeditin.session")||"";
var D,P='Dashboard',M=['Dashboard','Pesanan','Tugas saya','Layanan','Pembayaran','Pengguna'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function rp(x){return 'Rp '+Number(x||0).toLocaleString('id-ID')}function dt(x){return x?new Date(x).toLocaleDateString('id-ID'):'—'}function tag(s){return '<span class="tag '+(['Lunas','Selesai','Siap Dikerjakan'].includes(s)?'green':['Dikerjakan','DP'].includes(s)?'blue':'')+'">'+esc(s)+'</span>'}function fail(e){alert(e&&e.message||e||'Terjadi kesalahan')}function call(name,args,done){var r=google.script.run.withFailureHandler(fail).withSuccessHandler(done||reload);r[name].apply(r,(args||[]).concat([TOKEN]))}function init(){google.script.run.withSuccessHandler(function(x){D=x;draw()}).withFailureHandler(function(e){showLogin(e.message)}).getBootstrap(TOKEN)}
function showLogin(message){document.getElementById('app').innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="panel" style="width:min(420px,100%);padding:28px"><img src="'+LOGO_DATA+'" style="width:100%;max-height:110px;object-fit:contain;margin-bottom:16px"><h1 style="margin:0">Masuk ke haloeditin</h1><p class="muted">Gunakan akun yang diberikan Owner.</p><form onsubmit="doLogin(event)"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Kata sandi</label><input name="password" type="password" required autocomplete="current-password"></div><p class="subtle" style="color:var(--orange)">'+esc(message||'')+'</p><button class="btn" style="width:100%">Masuk</button></form><button class="btn secondary" style="width:100%;margin-top:10px" onclick="googleLogin()">Masuk dengan akun Google</button></div></div>'}
function doLogin(e){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(function(s){TOKEN=s.token;localStorage.setItem('haloeditin.session',TOKEN);init()}).withFailureHandler(function(x){showLogin(x.message)}).login(f.email.value,f.password.value)}
function googleLogin(){google.script.run.withSuccessHandler(function(s){TOKEN=s.token;localStorage.setItem('haloeditin.session',TOKEN);init()}).withFailureHandler(function(x){showLogin(x.message)}).loginWithGoogle()}
function signOut(){google.script.run.logout(TOKEN);TOKEN='';localStorage.removeItem('haloeditin.session');showLogin('Anda sudah keluar.')}

function go(n){P=n;draw()}function draw(){var role=D.user.Role,ns=M.filter(function(n){return !(role==='Editor'&&['Layanan','Pembayaran','Pengguna'].includes(n))&&!(role==='Admin'&&n==='Pengguna')});if(!ns.includes(P))P='Dashboard';var views={Dashboard:home,Pesanan:orders,'Tugas saya':tasks,Layanan:services,Pembayaran:payments,Pengguna:users};document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="brand"><img class="brand-logo" src="'+LOGO_DATA+'"><span>haloeditin</span></div><nav class="nav">'+ns.map(function(n){return '<button class="'+(n===P?'on':'')+'" onclick="go(\''+n+'\')">'+n+'</button>'}).join('')+'</nav><div class="profile">'+esc(D.user.Nama)+'<br>'+esc(role)+'</div></aside><main><header class="top">Workspace / '+P+'<span>'+esc(D.user.Nama)+'</span></header><section class="content">'+views[P]()+'</section></main></div>'}
function metric(a,b){return '<div class="card"><small>'+a+'</small><strong>'+b+'</strong></div>'}function head(title,sub,button){return '<div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+button+'</div>'}function orderTable(os){return os.length?'<div class="scroll"><table><tr><th>Pesanan</th><th>Klien</th><th>Layanan</th><th>Editor</th><th>Tenggat</th><th>Status</th><th>Tagihan</th><th></th></tr>'+os.map(function(o){var paid=paidFor(o.OrderID);return '<tr><td><b>'+esc(o.Judul)+'</b><br><span class="subtle">'+esc(o.OrderID)+'</span></td><td>'+esc(o.NamaKlien)+'</td><td>'+esc((o.items||[]).map(function(i){return i.NamaLayanan}).join(', ')||'—')+'</td><td>'+esc(o.task?nameFor(o.task.EditorEmail):'Belum ditugaskan')+'</td><td>'+dt(o.Deadline)+'</td><td>'+tag(o.Status)+'</td><td>'+rp(paid)+' / '+rp(o.Total)+'</td><td><button class="act" onclick="openOrder(\''+esc(o.OrderID)+'\')">Detail</button></td></tr>'}).join('')+'</table></div>':'<div class="empty">Belum ada pesanan.</div>'}function paidFor(id){return (D.payments||[]).filter(function(p){return p.OrderID===id&&p.Status!=='Refund'}).reduce(function(s,p){return s+Number(p.Nominal||0)},0)}function nameFor(email){var u=(D.users||[]).find(function(x){return x.Email===email});return u?u.Nama:email||'—'}
function home(){var os=D.orders,paid=(D.payments||[]).filter(function(p){return p.Status!=='Refund'}).reduce(function(s,p){return s+Number(p.Nominal||0)},0),left=os.reduce(function(s,o){return s+Math.max(0,Number(o.Total)-paidFor(o.OrderID))},0),active=os.filter(function(o){return !['Selesai','Dibatalkan'].includes(o.Status)});return head('Selamat datang, '+esc(D.user.Nama.split(' ')[0])+' 👋','Ringkasan pekerjaan dan pembayaran.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newOrder()">＋ Pesanan baru</button>')+'<div class="metrics">'+metric('Pesanan aktif',active.length)+metric('Tenggat terlewat',active.filter(function(o){return o.Deadline&&new Date(o.Deadline)<new Date()}).length)+metric('Pembayaran masuk',rp(paid))+metric('Sisa tagihan',rp(left))+'</div><div class="grid"><div class="panel"><h2>Pesanan terbaru</h2>'+orderTable(os.slice().reverse().slice(0,6))+'</div><div class="panel"><h2>Fokus pengerjaan</h2>'+(D.tasks.length?D.tasks.map(function(t){return '<div class="row"><b>'+esc(orderName(t.OrderID))+'</b><small>'+dt(t.Deadline)+' · '+tag(t.Status)+'</small></div>'}).join(''):'<div class="empty">Belum ada tugas aktif.</div>')+'</div></div>'}function orderName(id){var o=D.orders.find(function(x){return x.OrderID===id});return o?o.Judul:id}
function orders(){return head('Pesanan','Kelola klien, layanan, editor, tenggat, dan file.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newOrder()">＋ Pesanan baru</button>')+'<div class="panel">'+orderTable(D.orders.slice().reverse())+'</div>'}
function tasks(){return head('Tugas saya','Perbarui progres pekerjaan yang ditugaskan.','')+'<div class="panel">'+(D.tasks.length?D.tasks.map(function(t){return '<div class="row"><b>'+esc(orderName(t.OrderID))+'</b><small>'+esc(t.OrderID)+' · Tenggat '+dt(t.Deadline)+' · '+tag(t.Status)+'</small><small>'+esc(t.Catatan||'Belum ada catatan')+'</small><button class="act" onclick="editTask(\''+esc(t.TaskID)+'\')">Perbarui progres</button><button class="act" onclick="openOrder(\''+esc(t.OrderID)+'\')">File pekerjaan</button></div>'}).join(''):'<div class="empty">Belum ada tugas untuk Anda.</div>')+'</div>'}
function services(){return head('Layanan','Daftar jasa dan tarif dasar.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newService()">＋ Tambah layanan</button>')+'<div class="panel">'+(D.services.length?'<div class="scroll"><table><tr><th>Layanan</th><th>Deskripsi</th><th>Harga dasar</th></tr>'+D.services.map(function(s){return '<tr><td><b>'+esc(s.Nama)+'</b></td><td>'+esc(s.Deskripsi)+'</td><td>'+rp(s.HargaDasar)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Katalog belum diisi. Tambahkan layanan atau impor dari daftar Excel nanti.</div>')+'</div>'}
function payments(){return head('Pembayaran','Riwayat transaksi dan sisa tagihan.',D.user.Role==='Editor'?'':'<button class="btn" onclick="newPayment()">＋ Catat pembayaran</button>')+'<div class="panel">'+((D.payments||[]).length?'<div class="scroll"><table><tr><th>Tanggal</th><th>ID pembayaran</th><th>Pesanan</th><th>Nominal</th><th>Metode</th><th>Status</th></tr>'+D.payments.slice().reverse().map(function(p){return '<tr><td>'+dt(p.Tanggal)+'</td><td>'+esc(p.PaymentID)+'</td><td>'+esc(orderName(p.OrderID))+'<br><span class="subtle">'+esc(p.OrderID)+'</span></td><td>'+rp(p.Nominal)+'</td><td>'+esc(p.Metode)+'</td><td>'+tag(p.Status)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Belum ada pembayaran tercatat.</div>')+'</div>'}
function users(){return head('Pengguna','Kelola akun dan akses Editor, Admin, dan Owner.','<button class="btn" onclick="newUser()">＋ Tambah pengguna</button>')+'<div class="panel">'+D.users.map(function(u,i){return '<div class="row"><b>'+esc(u.Nama)+'</b><small>'+esc(u.Email)+' · '+tag(u.Role)+' · '+esc(u.Aktif)+'</small><button class="act" onclick="newUser(D.users['+i+'])">Kelola akun</button></div>'}).join('')+'</div>'}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalBg').style.display='flex'}function closeModal(){document.getElementById('modalBg').style.display='none'}function reload(){closeModal();google.script.run.withSuccessHandler(function(x){D=x;draw()}).withFailureHandler(function(e){showLogin(e.message)}).getBootstrap(TOKEN)}
function newOrder(){var editors=(D.users||[]).filter(function(u){return u.Role==='Editor'&&String(u.Aktif).toLowerCase()!=='tidak'});openModal('<h2>Pesanan baru</h2><form id="orderForm" onsubmit="submitOrder(event)"><div class="form-grid"><div class="field"><label>Nama klien *</label><input name="client" required></div><div class="field"><label>Kontak klien</label><input name="contact" placeholder="WhatsApp / telepon"></div><div class="field"><label>Email klien</label><input name="email" type="email"></div><div class="field"><label>Judul pekerjaan *</label><input name="title" required placeholder="Contoh: Skripsi Bab 1–5"></div><div class="field"><label>Jenis dokumen</label><select name="doctype"><option>Skripsi</option><option>Artikel</option><option>Jurnal</option><option>Lainnya</option></select></div><div class="field"><label>Tenggat</label><input name="deadline" type="date"></div><div class="field full"><label>Pilih layanan</label>'+(D.services.length?D.services.map(function(s){return '<label class="service-option"><input type="checkbox" data-svc="'+esc(s.ServiceID)+'"><span>'+esc(s.Nama)+'<small class="subtle">'+esc(s.Kategori||'')+' · '+esc(s.Satuan||'')+' · '+esc(s.Catatan||'')+'</small></span><select data-tier="'+esc(s.ServiceID)+'">'+(s.PriceTiers||[]).map(function(price,ix){return price==null?'':'<option value="'+ix+'">'+esc(D.statuses.priceTiers?D.statuses.priceTiers[ix]:'Tarif '+(ix+1))+' · '+rp(price)+'</option>'}).join('')+'</select><input type="number" min="1" value="1" data-qty="'+esc(s.ServiceID)+'" aria-label="Jumlah '+esc(s.Nama)+'"></label>'}).join(''):'<p class="subtle">Belum ada layanan. Pesanan tetap bisa dibuat tanpa layanan.</p>')+'</div><div class="field"><label>Tugaskan ke editor</label><select name="editor"><option value="">Belum ditugaskan</option>'+editors.map(function(u){return '<option value="'+esc(u.Email)+'">'+esc(u.Nama)+' — '+esc(u.Email)+'</option>'}).join('')+'</select></div><div class="field full"><label>Catatan</label><textarea name="note" placeholder="Brief atau instruksi pekerjaan"></textarea></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan pesanan</button></div></form>')}
function submitOrder(e){e.preventDefault();var f=e.target,items=[];document.querySelectorAll('[data-svc]:checked').forEach(function(c){var s=D.services.find(function(x){return x.ServiceID===c.dataset.svc});items.push({ServiceID:s.ServiceID,TierIndex:Number(document.querySelector('[data-tier="'+s.ServiceID+'"]').value||0),NamaLayanan:s.Nama,Qty:Number(document.querySelector('[data-qty="'+s.ServiceID+'"]').value||1)})});var input={NamaKlien:f.client.value,Kontak:f.contact.value,Email:f.email.value,Judul:f.title.value,JenisDokumen:f.doctype.value,Deadline:f.deadline.value,Catatan:f.note.value,EditorEmail:f.editor.value,items:items};google.script.run.withSuccessHandler(function(x){closeModal();reload();alert('Pesanan '+x.id+' berhasil dibuat. Folder file tersedia di detail pesanan.')}).withFailureHandler(fail).saveOrder(input,TOKEN)}
function openOrder(id){var o=D.orders.find(function(x){return x.OrderID===id});if(!o)return;var pays=(D.payments||[]).filter(function(p){return p.OrderID===id}),files='Memuat file…';openModal('<h2>'+esc(o.Judul)+'</h2><p class="subtle">'+esc(o.OrderID)+' · '+tag(o.Status)+'</p><div class="form-grid"><div><b>Klien</b><br>'+esc(o.NamaKlien)+'<br>'+esc(o.JenisDokumen||'')+'</div><div><b>Tenggat</b><br>'+dt(o.Deadline)+'<br>Editor: '+esc(o.task?nameFor(o.task.EditorEmail):'Belum ditugaskan')+'</div><div class="field full"><b>Layanan</b><br>'+(o.items||[]).map(function(i){return esc(i.NamaLayanan)+' × '+i.Qty+' — '+rp(i.Subtotal)}).join('<br>')+'<br><b>Total '+rp(o.Total)+'</b></div><div class="field full"><b>Pembayaran</b><br>'+(pays.length?pays.map(function(p){return dt(p.Tanggal)+' · '+rp(p.Nominal)+' · '+tag(p.Status)}).join('<br>'):'Belum ada pembayaran')+'</div><div class="field full"><b>File pesanan</b><div id="fileList">'+files+'</div><label class="act" for="fileInput">＋ Unggah file</label><input id="fileInput" type="file" style="display:none" onchange="uploadSelected(\''+esc(id)+'\',this)"><p class="subtle">Maksimal 8 MB per file. File editor masuk ke File Kerja; file owner/admin masuk ke File Awal.</p></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Tutup</button>'+(D.user.Role==='Owner'||D.user.Role==='Admin'?'<button class="btn" onclick="newPayment(\''+esc(id)+'\')">＋ Pembayaran</button>':'')+'</div>');google.script.run.withSuccessHandler(function(fs){var el=document.getElementById('fileList');if(el)el.innerHTML=fs.length?fs.map(function(f){return '<div><a class="file-link" target="_blank" href="'+esc(f.url)+'">'+esc(f.name)+'</a></div>'}).join(''):'Belum ada file.'}).withFailureHandler(fail).getOrderFiles(id,TOKEN)}
function uploadSelected(id,input){var file=input.files[0];if(!file)return;if(file.size>8*1024*1024){alert('Ukuran file maksimal 8 MB.');input.value='';return}var reader=new FileReader();reader.onload=function(){var data=String(reader.result).split(',')[1];google.script.run.withSuccessHandler(function(){openOrder(id);google.script.run.withSuccessHandler(function(fs){var el=document.getElementById('fileList');if(el)el.innerHTML=fs.map(function(f){return '<div><a class="file-link" target="_blank" href="'+esc(f.url)+'">'+esc(f.name)+'</a></div>'}).join('')||'Belum ada file.'}).getOrderFiles(id,TOKEN)}).withFailureHandler(fail).uploadFile(id,file.name,file.type||'application/octet-stream',data,TOKEN)};reader.readAsDataURL(file)}
function newPayment(orderId){var choices=D.orders.filter(function(o){return !orderId||o.OrderID===orderId});if(!choices.length){alert('Belum ada pesanan.');return}openModal('<h2>Catat pembayaran</h2><form id="payForm" onsubmit="submitPayment(event)"><div class="field"><label>Pesanan *</label><select name="order" required>'+choices.map(function(o){return '<option value="'+esc(o.OrderID)+'">'+esc(o.Judul)+' · sisa '+rp(Math.max(0,Number(o.Total)-paidFor(o.OrderID)))+'</option>'}).join('')+'</select></div><div class="form-grid"><div class="field"><label>Nominal *</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Tanggal</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Metode</label><select name="method"><option>Transfer</option><option>Tunai</option><option>E-wallet</option><option>Lainnya</option></select></div><div class="field"><label>Status</label><select name="status"><option>DP</option><option>Lunas</option></select></div><div class="field full"><label>Catatan</label><input name="note"></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan pembayaran</button></div></form>')}
function submitPayment(e){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(reload).withFailureHandler(fail).addPayment({OrderID:f.order.value,Nominal:f.amount.value,Tanggal:f.date.value,Metode:f.method.value,Status:f.status.value,Catatan:f.note.value},TOKEN)}
function newService(){openModal('<h2>Tambah layanan</h2><form id="serviceForm" onsubmit="submitService(event)"><div class="field"><label>Nama layanan *</label><input name="name" required></div><div class="field"><label>Deskripsi</label><textarea name="desc"></textarea></div><div class="field"><label>Harga dasar (Rp) *</label><input name="price" type="number" min="0" required></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan layanan</button></div></form>')}
function submitService(e){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(reload).withFailureHandler(fail).saveService({Nama:f.name.value,Deskripsi:f.desc.value,HargaDasar:f.price.value},TOKEN)}
function newUser(user){user=user||{};openModal('<h2>'+(user.Email?'Ubah pengguna':'Tambah pengguna')+'</h2><form id="userForm" onsubmit="submitUser(event)"><div class="field"><label>Nama *</label><input name="name" required value="'+esc(user.Nama||'')+'"></div><div class="field"><label>Email akun *</label><input name="email" type="email" required value="'+esc(user.Email||'')+'" '+(user.Email?'readonly':'')+'></div><div class="field"><label>Role</label><select name="role"><option '+(user.Role==='Editor'?'selected':'')+'>Editor</option><option '+(user.Role==='Admin'?'selected':'')+'>Admin</option><option '+(user.Role==='Owner'?'selected':'')+'>Owner</option></select></div><div class="field"><label>Kata sandi '+(user.Email?'(kosongkan jika tidak diubah)':'*')+'</label><input name="password" type="password" '+(user.Email?'':'required')+' minlength="10" autocomplete="new-password"></div><div class="field"><label>Status akun</label><select name="active"><option '+(!user.Aktif||user.Aktif==='Ya'?'selected':'')+'>Ya</option><option '+(user.Aktif==='Tidak'?'selected':'')+'>Tidak</option></select></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan pengguna</button></div></form>')}
function submitUser(e){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(reload).withFailureHandler(fail).saveUser({Nama:f.name.value,Email:f.email.value,Role:f.role.value,Password:f.password.value,Aktif:f.active.value},TOKEN)}
function editTask(id){var t=D.tasks.find(function(x){return x.TaskID===id});openModal('<h2>Perbarui progres</h2><form id="taskForm" onsubmit="submitTask(event,\''+esc(id)+'\')"><div class="field"><label>Status tugas</label><select name="status">'+D.statuses.tasks.map(function(s){return '<option '+(s===t.Status?'selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select></div><div class="field"><label>Catatan progres</label><textarea name="note">'+esc(t.Catatan||'')+'</textarea></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan progres</button></div></form>')}
function submitTask(e,id){e.preventDefault();var f=e.target;google.script.run.withSuccessHandler(reload).withFailureHandler(fail).updateTask(id,f.status.value,f.note.value,TOKEN)}init();
</script></body></html>
